name: Foundation image build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.force && 'full' || 'scoped' }}
  cancel-in-progress: true
jobs:
  scope:
    name: Select foundation validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: scope
        env:
          FORCE_FOUNDATION: ${{ inputs.force && 'true' || 'false' }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { affectsFoundation } = await import(pathToFileURL(process.cwd() + '/scripts/foundation/ci.mjs').href);
            let required = true;
            if (process.env.FORCE_FOUNDATION !== 'true' && context.eventName === 'pull_request') {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: context.issue.number, per_page: 100,
              });
              required = files.length >= 3000 || affectsFoundation(files);
            } else if (process.env.FORCE_FOUNDATION !== 'true' && context.eventName === 'push' && !/^0+$/.test(context.payload.before)) {
              const { data } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: context.payload.before + '...' + context.sha, per_page: 1,
              });
              required = !data.files || data.files.length >= 300 || affectsFoundation(data.files);
            }
            core.setOutput('required', String(required));
  build:
    name: Foundation images (${{ matrix.arch }})
    needs: scope
    if: needs.scope.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and audit the final image layers
        env:
          ARCH: ${{ matrix.arch }}
        run: node scripts/foundation/build.mjs "$ARCH"
      - name: Enforce measured size budgets
        run: python3 scripts/foundation/measure.py out/foundation/evidence out/foundation/evidence/metrics.json --budgets images/foundation/budgets.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.11'
          cache: false
      - name: Run native foundation workload probes
        env:
          ARCH: ${{ matrix.arch }}
        run: node scripts/foundation/verify.mjs "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-candidate-${{ matrix.arch }}
          path: out/foundation/evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  gate:
    name: Foundation gate
    if: always()
    needs: [scope, build, index]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce foundation validation
        env:
          SCOPE: ${{ needs.scope.result }}
          REQUIRED: ${{ needs.scope.outputs.required }}
          BUILDS: ${{ needs.build.result }}
          INDEX: ${{ needs.index.result }}
        run: |
          node --test tests/foundation-ci.test.mjs
          node --input-type=module -e 'import { requireFoundation } from "./scripts/foundation/ci.mjs"; requireFoundation(...process.argv.slice(1));' "$SCOPE" "$REQUIRED" "$BUILDS" "$INDEX"
  index:
    name: Foundation OCI indexes
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: foundation-candidate-*
          path: out/foundation-input
      - name: Assemble and verify local OCI indexes
        run: |
          python3 scripts/foundation/index.py out/foundation-input out/foundation-index
          tar -czf out/foundation-index/static.oci.tar.gz -C out/foundation-index/layouts/static .
          tar -czf out/foundation-index/base.oci.tar.gz -C out/foundation-index/layouts/base .
          cat out/foundation-index/indexes.json
      - name: Verify corresponding source and bind SBOMs to native leaves
        run: |
          python3 scripts/foundation/source-evidence.py out/foundation-input/foundation-candidate-amd64
          python3 scripts/foundation/source-evidence.py out/foundation-input/foundation-candidate-arm64
          node scripts/release/foundation-evidence.mjs out/foundation-input out/foundation-index
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foundation-oci-indexes
          path: |
            out/foundation-index/*.tar.gz
            out/foundation-index/indexes.json
            out/foundation-index/evidence/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
