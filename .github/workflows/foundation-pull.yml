name: Verify published foundation pulls
on:
  pull_request:
    paths:
      - .github/workflows/foundation-pull.yml
      - scripts/release/verify-foundation-pull.mjs
      - scripts/release/refresh-baseline.mjs
  workflow_dispatch:
    inputs:
      release:
        description: Published foundation GitHub Release tag
        default: foundation-2023.12.20261102-r1
        required: true
        type: string
      registry:
        description: Compatibility repository or public mirrors of the current release
        type: choice
        options: [legacy, both, ghcr, quay]
        default: legacy
permissions:
  contents: read
jobs:
  verify:
    name: Verify public foundation pulls (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-foundation-pull
          RELEASE: ${{ inputs.release || 'foundation-2023.12.20261102-r1' }}
          ARCH: ${{ matrix.arch }}
          FOUNDATION_PULL_REGISTRY: ${{ inputs.registry || 'legacy' }}
        run: node scripts/release/verify-foundation-pull.mjs "$RELEASE" "$ARCH"
