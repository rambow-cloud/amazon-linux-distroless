name: Project release qualification
on:
  pull_request:
    paths:
      - .github/workflows/project-qualification.yml
      - scripts/release/language-metrics.py
      - scripts/release/project-qualification.mjs
      - scripts/release/project-stable-evidence.mjs
      - scripts/release/stable-registry.mjs
      - releases/runtime-support.json
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: project-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    name: Qualify foundations
    uses: ./.github/workflows/foundation-build.yml
    with:
      force: true
  matrix:
    name: Select all supported runtime lines
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.plan.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { supportedMajors } from './scripts/java21/config.mjs';
          import { runtimes } from './scripts/runtime/config.mjs';
          const lines = [...supportedMajors.map(n => 'java' + n), ...Object.keys(runtimes)];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'lines=' + JSON.stringify(lines) + '\n');
          NODE
  language:
    name: Clean language build (${{ matrix.line }}, ${{ matrix.arch }}, ${{ matrix.sample }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.matrix.outputs.lines) }}
        arch: [amd64, arm64]
        sample: [a, b]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: startsWith(matrix.line, 'python')
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Build, run native workloads and measure the resulting image
        env:
          LINE: ${{ matrix.line }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$LINE" == java* ]]; then
            node scripts/java21/build.mjs "$ARCH" "${LINE#java}"
            node scripts/java21/verify.mjs "$ARCH" "${LINE#java}"
          else
            node scripts/runtime/build.mjs "$LINE" "$ARCH"
            node scripts/runtime/verify.mjs "$LINE" "$ARCH"
          fi
          python3 scripts/release/language-metrics.py "$LINE" "$ARCH" "out/$LINE/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: language-${{ matrix.line }}-${{ matrix.arch }}-${{ matrix.sample }}
          path: out/${{ matrix.line }}/${{ matrix.arch }}/language-metrics.json
          if-no-files-found: error
          retention-days: 14
  stable-evidence:
    name: Verify signed language releases and support windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-stable-evidence
        run: node scripts/release/project-stable-evidence.mjs stable-language-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-language-evidence
          path: stable-language-evidence.json
          if-no-files-found: error
          retention-days: 30
  qualify:
    name: Full native runtime matrix and reproducibility gate
    needs: [foundation, matrix, language, stable-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{language-*,foundation-oci-indexes,stable-language-evidence}'
          path: out/qualification
      - run: node scripts/release/project-qualification.mjs out/qualification out/qualification/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: project-qualification-report
          path: out/qualification/report.json
          if-no-files-found: ignore
