name: Java 21 qualification
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: java21-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select Java validation scope
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        id: scope
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('required', 'true');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.issue.number, per_page: 100 });
            const relevant = /^(images\/java21\/|locks\/java21\/|scripts\/java21\/|scripts\/prototype\/|examples\/java21\/)|^\.dockerignore$|^\.github\/workflows\/java21-build\.yml$/;
            core.setOutput('required', files.some(file => relevant.test(file.filename) || relevant.test(file.previous_filename || '')) ? 'true' : 'false');
  build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: Java 21 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build native Java runtime from reviewed locks
        run: node scripts/java21/build.mjs ${{ matrix.arch }}
      - name: Verify hardened headless service, TLS and final image
        run: node scripts/java21/verify.mjs ${{ matrix.arch }}
      - name: Summarize native results
        run: cat out/java21/${{ matrix.arch }}/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java21-${{ matrix.arch }}-image
          path: out/java21/${{ matrix.arch }}/image.tar.gz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java21-${{ matrix.arch }}-evidence
          path: |
            out/java21/${{ matrix.arch }}/*.json
            out/java21/${{ matrix.arch }}/*.md
            out/java21/${{ matrix.arch }}/project-source.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java21-${{ matrix.arch }}-sources
          path: out/java21/${{ matrix.arch }}/sources.tar.gz
          compression-level: 0
          retention-days: 14
      - name: Preserve diagnostic metadata
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java21-${{ matrix.arch }}-diagnostics
          path: out/java21/${{ matrix.arch }}/*.json
          if-no-files-found: ignore
  gate:
    name: Java 21 gate
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          JAVA_REQUIRED: ${{ needs.changes.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            if (process.env.SCOPE_RESULT !== 'success') core.setFailed('Could not determine Java validation scope.');
            else if (process.env.JAVA_REQUIRED === 'true' && process.env.BUILD_RESULT !== 'success') core.setFailed('Both native Java qualification jobs must pass.');
            else core.info('Required Java validation is satisfied.');
