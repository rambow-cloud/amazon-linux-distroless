name: Repository checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate issue policy behavior
        run: node --test tests/issue-policy.test.mjs
      - name: Check configuration script syntax
        run: node --check scripts/sync-github-config.mjs
      - name: Validate Java publication policy
        run: node --test tests/java21-release.test.mjs
      - name: Check Java publication script syntax
        run: node --check scripts/release/java21-publish.mjs
