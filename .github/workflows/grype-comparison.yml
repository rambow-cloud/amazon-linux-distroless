name: Grype Java CVE comparison
on:
  workflow_dispatch:
  push:
    branches: [security/grype-compare]
    paths:
      - security/**
      - .github/workflows/grype-comparison.yml
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Compare Java images with Grype
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Grype normalization and native coverage behavior
        run: node --test security/grype.test.mjs
      - name: Download the original tested prototype
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: al2023-java-prototype-with-sources
          path: out/prototype-input
          run-id: 42253997086
          github-token: ${{ github.token }}
      - name: Reuse native RPM databases and prior Trivy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: java-native-rpmdb-cve-comparison
          path: out/native-input
          run-id: 42290077926
          github-token: ${{ github.token }}
      - name: Catalog with Syft and scan all targets with one Grype database
        run: node security/grype.mjs
      - name: Add results to the run summary
        run: cat out/grype/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw SBOMs, findings and database fingerprints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-grype-cve-comparison
          path: out/grype/
          if-no-files-found: error
          retention-days: 30
