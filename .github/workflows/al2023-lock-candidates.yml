name: Prepare AL2023 snapshot lock candidates
on:
  workflow_run:
    workflows: [AL2023 builder discovery]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/al2023-lock-candidates.yml
      - scripts/upstream/al2023-lock-candidate.mjs
      - scripts/upstream/al2023-refresh-policy.mjs
      - scripts/upstream/automate-al2023-refresh.mjs
      - tests/al2023-refresh.test.mjs
permissions:
  actions: read
  contents: read
jobs:
  plan:
    name: Select the official immutable snapshot
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'rambow-cloud/amazon-linux-distroless' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_run'
        with:
          name: al2023-builder-discovery
          path: out/al2023-discovery
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: plan
        run: |
          node --test tests/al2023-refresh.test.mjs tests/upstream-discovery.test.mjs
          node --check scripts/upstream/automate-al2023-refresh.mjs
          node --check scripts/release/al2023-refresh-evidence.mjs
          node scripts/upstream/al2023-lock-candidate.mjs plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: al2023-candidate-plan
          path: out/al2023-candidate/plan.json
          if-no-files-found: error
  resolve:
    name: Prepare native lock (${{ matrix.family }}, ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        family: [foundation, java17, java21, java25, python, nodejs]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: al2023-candidate-plan
          path: out/al2023-candidate
      - env:
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/upstream/al2023-lock-candidate.mjs stage "$FAMILY" "$ARCH"
          case "$FAMILY" in
            foundation) node scripts/foundation/lock.mjs "$ARCH" resolve ;;
            java*) node scripts/java21/lock.mjs "$ARCH" "${FAMILY#java}" ;;
            python|nodejs) node scripts/runtime/lock.mjs "$FAMILY" "$ARCH" --rpm-only ;;
            *) exit 1 ;;
          esac
          node scripts/upstream/al2023-lock-candidate.mjs collect "$FAMILY" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: al2023-lock-${{ matrix.family }}-${{ matrix.arch }}
          path: out/al2023-candidate/delivery/
          if-no-files-found: error
          retention-days: 30
  apply:
    name: Reconcile a trusted AL2023 refresh through protected gates
    needs: [plan, resolve]
    if: >-
      always() && needs.plan.result == 'success' &&
      github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' &&
      github.repository == 'rambow-cloud/amazon-linux-distroless' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
      vars.UPSTREAM_UPDATE_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: unattended-runtime-updates
      queue: max
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: al2023-builder-discovery
          path: out/al2023-discovery
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: al2023-candidate-plan
          path: out/al2023-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.resolve.result == 'success'
        with:
          pattern: al2023-lock-*
          path: out/al2023-refresh-input
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_UPDATE_APP_PRIVATE_KEY }}
          owner: rambow-cloud
          repositories: amazon-linux-distroless
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTION_TOKEN: ${{ github.token }}
          UPDATE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
          QUAY_RUNTIME_MIRROR_ENABLED: ${{ vars.QUAY_RUNTIME_MIRROR_ENABLED }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-refresh
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: node scripts/upstream/automate-al2023-refresh.mjs
