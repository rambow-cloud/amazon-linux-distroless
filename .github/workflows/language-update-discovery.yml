name: Upstream language update discovery
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/language-update-discovery.yml
      - scripts/upstream/language-discovery*.mjs
      - tests/language-discovery.test.mjs
permissions:
  contents: read
concurrency:
  group: language-discovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  discover:
    name: Discover final CPython and Node.js updates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test tests/language-discovery.test.mjs
      - id: observe
        run: node scripts/upstream/language-discovery.mjs observe
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.observe.outputs.candidates == 'true' && github.ref == 'refs/heads/main'
        with:
          cosign-release: v3.1.4
      - name: Verify candidate source and binary inputs and write lock diffs
        if: steps.observe.outputs.candidates == 'true' && github.ref == 'refs/heads/main'
        run: node scripts/upstream/language-discovery.mjs lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-language-update-evidence
          path: |
            out/language-updates/observations.json
            out/language-updates/lock-diffs.json
            out/language-updates/candidate/
          if-no-files-found: error
          retention-days: 30
