name: Publish Java runtime preview
run-name: Preview java${{ inputs.major }}
on:
  workflow_dispatch:
    inputs:
      major:
        description: Qualified Corretto major to publish
        type: choice
        options: ['17', '21', '25']
        default: '21'
        required: true
      unique_preview:
        description: Use a run-specific preview tag for unattended recovery
        type: boolean
        default: false
      expected_commit:
        description: Protected main commit selected by update automation
        type: string
        default: ''
env:
  JAVA_MAJOR: ${{ inputs.major || '21' }}
permissions:
  contents: read
concurrency:
  group: java${{ inputs.major || '21' }}-preview-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Qualify release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Verify the selected source commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test -z "$EXPECTED_COMMIT" || test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/java21/build.mjs ${{ matrix.arch }}
      - run: node scripts/java21/verify.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java${{ inputs.major || '21' }}-${{ matrix.arch }}-image
          path: out/java${{ inputs.major || '21' }}/${{ matrix.arch }}/image.tar.gz
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java${{ inputs.major || '21' }}-${{ matrix.arch }}-evidence
          path: |
            out/java${{ inputs.major || '21' }}/${{ matrix.arch }}/*.json
            out/java${{ inputs.major || '21' }}/${{ matrix.arch }}/*.md
            out/java${{ inputs.major || '21' }}/${{ matrix.arch }}/project-source.tar.gz
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java${{ inputs.major || '21' }}-${{ matrix.arch }}-sources
          path: out/java${{ inputs.major || '21' }}/${{ matrix.arch }}/sources.tar.gz
          compression-level: 0
          retention-days: 14
  publish:
    name: Publish signed Java runtime preview
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication policy
        run: node --test tests/java21-release.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: java${{ inputs.major || '21' }}-*
          path: out/release-inputs
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - name: Gate metadata, preserve source, publish and verify signatures
        env:
          GH_TOKEN: ${{ github.token }}
          UNIQUE_PREVIEW: ${{ inputs.unique_preview }}
        run: node scripts/release/java21-publish.mjs
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java${{ inputs.major || '21' }}-publication-evidence
          path: |
            out/publication/*.json
            out/publication/*.md
            out/publication/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 30
