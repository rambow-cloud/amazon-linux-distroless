name: Issue policy

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-policy:
    name: Issue policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata only: do not check out the PR or execute contributor code here.
      - name: Validate linked issue readiness
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '').replace(/^```[^\n]*\n[\s\S]*?^```\s*$/gm, '');
            const references = [...body.matchAll(/^\s*(?:closes|fixes|resolves)\s+#([1-9]\d*)\.?\s*$/gim)];
            const numbers = [...new Set(references.map(match => Number(match[1])))];
            if (!numbers.length) {
              core.setFailed('Add a standalone closing line such as Closes #123 for a same-repository issue.');
              return;
            }
            const errors = [];
            for (const issue_number of numbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number }));
              } catch (error) {
                if (error.status !== 404) throw error;
                errors.push(`#${issue_number}: issue not found in this repository.`);
                continue;
              }
              if (issue.pull_request) errors.push(`#${issue_number}: must reference an issue, not a pull request.`);
              if (issue.state !== 'open') errors.push(`#${issue_number}: issue must be open.`);
              if (!issue.milestone || issue.milestone.state !== 'open') errors.push(`#${issue_number}: assign an open milestone.`);
              const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
              const allowed = {
                type: ['bug', 'feature', 'task', 'rfc', 'maintenance'],
                area: ['build', 'runtime', 'security', 'ci', 'release', 'docs', 'governance'],
                priority: ['p0', 'p1', 'p2', 'p3'],
                status: ['triage', 'ready', 'in-progress', 'blocked'],
              };
              for (const [family, values] of Object.entries(allowed)) {
                const selected = labels.filter(label => label.startsWith(`${family}:`));
                if (selected.length !== 1 || !values.map(value => `${family}:${value}`).includes(selected[0])) {
                  errors.push(`#${issue_number}: assign exactly one supported ${family}: label.`);
                }
              }
              if (!labels.some(label => ['status:ready', 'status:in-progress'].includes(label))) {
                errors.push(`#${issue_number}: issue must be ready or in progress.`);
              }
              const issueBody = (issue.body || '').replace(/<!--[\s\S]*?-->/g, '');
              const criteria = issueBody.match(/^#{2,3}\s+Acceptance criteria\s*\r?\n([\s\S]*?)(?=^#{1,3}\s|$(?![\s\S]))/im)?.[1] || '';
              if (!/^\s*- \[[ xX]\]\s+\S.+$/m.test(criteria)) {
                errors.push(`#${issue_number}: add actionable Markdown checkboxes under Acceptance criteria.`);
              }
            }
            if (errors.length) {
              errors.forEach(error => core.error(error));
              core.setFailed('Linked issues do not meet the repository issue-driven development policy.');
            } else {
              core.info(`Validated ${numbers.length} linked issue(s).`);
            }
