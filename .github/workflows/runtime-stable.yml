name: Runtime stable promotion
run-name: Stable ${{ inputs.mode }} ${{ inputs.runtime }}
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Version line from the reviewed stable candidate plan
        type: choice
        options: [all, java17, java21, java25, python311, python312, python313, python314, nodejs22, nodejs24, nodejs26]
        default: all
        required: true
      mode:
        description: Check, publish, or mirror an existing stable release
        type: choice
        options: [check, publish, mirror]
        default: check
        required: true
      registry:
        description: Destination for mirror mode. Publish uses the configured registries.
        type: choice
        options: [both, ghcr, quay]
        default: both
        required: true
      expected_commit:
        description: Protected main commit selected by update automation
        type: string
        default: ''
permissions:
  contents: read
jobs:
  plan:
    name: Select reviewed stable candidates
    runs-on: ubuntu-24.04
    outputs:
      runtimes: ${{ steps.plan.outputs.runtimes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          STABLE_SELECTION: ${{ inputs.runtime }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { stablePlan } from './scripts/release/stable-policy.mjs';
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          if (process.env.EXPECTED_COMMIT) assert.equal(process.env.GITHUB_SHA, process.env.EXPECTED_COMMIT);
          const plan = JSON.parse(fs.readFileSync('releases/stable-candidates.json'));
          const selection = process.env.STABLE_SELECTION;
          const selected = selection === 'all' ? Object.keys(plan) : [selection];
          const runtimes = selected.map(id => {
            assert.ok(Object.hasOwn(plan, id), 'Unknown stable runtime');
            return { runtime: id, family: stablePlan(id, plan[id]).variant };
          });
          assert.ok(runtimes.length);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'runtimes=' + JSON.stringify(runtimes) + '\n');
          NODE
  stable:
    name: Stable ${{ inputs.mode }} (${{ matrix.runtime }})
    needs: plan
    environment: quay-runtime-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runtimes) }}
    concurrency:
      group: stable-runtime-${{ inputs.mode == 'check' && format('{0}-{1}', github.run_id, matrix.runtime) || matrix.family }}
      queue: max
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        if: inputs.mode != 'check'
        with:
          version: 1.3.6
      - name: Validate and promote the signed image index
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUNTIME: ${{ matrix.runtime }}
          STABLE_MODE: ${{ inputs.mode }}
          STABLE_MIRROR_REGISTRY: ${{ inputs.registry }}
          QUAY_RUNTIME_MIRROR_ENABLED: ${{ vars.QUAY_RUNTIME_MIRROR_ENABLED }}
          DOCKER_CONFIG: ${{ runner.temp }}/stable-docker-auth
        run: node scripts/release/runtime-stable.mjs
      - name: Preserve stable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.runtime }}-stable-evidence
          path: out/stable-evidence/*.json
          if-no-files-found: ignore
          retention-days: 30
