name: Language runtime lock update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve ${{ matrix.variant }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant: [python, nodejs]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: matrix.variant == 'python'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - run: node scripts/runtime/lock.mjs "${{ matrix.variant }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-lock-${{ matrix.variant }}-${{ matrix.arch }}
          path: out/resolved/locks/upstream/
          retention-days: 14
