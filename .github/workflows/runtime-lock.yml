name: Language runtime lock update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve ${{ matrix.variant }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        variant: [python, nodejs]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - if: matrix.variant == 'python'
        uses: sigstore/cosign-installer@v4.1.4
        with:
          cosign-release: v3.1.4
      - run: node scripts/runtime/lock.mjs "${{ matrix.variant }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: upstream-lock-${{ matrix.variant }}-${{ matrix.arch }}
          path: out/resolved/locks/upstream/
          retention-days: 14
