name: Language runtime lock update
on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime line to resolve
        type: choice
        options: ['python314', 'nodejs24']
        default: 'python314'
        required: true
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve ${{ inputs.runtime }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node scripts/runtime/lock.mjs ${{ inputs.runtime }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.runtime }}-lock-${{ matrix.arch }}
          path: |
            out/locks/${{ inputs.runtime }}/linux-${{ matrix.arch }}.json
            out/locks/${{ inputs.runtime }}/files-${{ matrix.arch }}.txt
            out/locks/${{ inputs.runtime }}/runtime-${{ matrix.arch }}.json
          retention-days: 14
