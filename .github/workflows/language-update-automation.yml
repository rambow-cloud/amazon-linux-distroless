name: Apply trusted upstream language updates
on:
  workflow_run:
    workflows: [Upstream language update discovery]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/language-update-automation.yml
      - scripts/upstream/automation-policy.mjs
      - scripts/upstream/automate-language-update.mjs
      - tests/language-update-automation.test.mjs
permissions:
  contents: read
jobs:
  policy:
    name: Validate unattended update policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          node --test tests/language-update-automation.test.mjs
          node --check scripts/upstream/automate-language-update.mjs
  apply:
    name: Apply a verified same-line release through protected PRs
    needs: policy
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'rambow-cloud/amazon-linux-distroless' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event) &&
      vars.UPSTREAM_UPDATE_APP_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: unattended-language-updates
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-language-update-evidence
          path: out/automated-input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: candidate
        run: |
          if test -f out/automated-input/lock-diffs.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.candidate.outputs.ready == 'true'
        with:
          cosign-release: v3.1.4
      - id: app
        if: steps.candidate.outputs.ready == 'true'
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.UPSTREAM_UPDATE_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_UPDATE_APP_PRIVATE_KEY }}
          owner: rambow-cloud
          repositories: amazon-linux-distroless
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
      - if: steps.candidate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTION_TOKEN: ${{ github.token }}
        run: node scripts/upstream/automate-language-update.mjs
