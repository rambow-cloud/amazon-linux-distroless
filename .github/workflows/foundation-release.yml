name: Publish stable foundation images
run-name: ${{ inputs.mode == 'mirror' && (inputs.release_tag && format('Repair foundation {0}', inputs.release_tag) || format('Mirror foundation ({0})', inputs.registry)) || format('Foundation revision {0}', inputs.revision) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a qualified snapshot or mirror the current signed release
        type: choice
        options: [publish, mirror]
        default: publish
      registry:
        description: Destination in mirror mode
        type: choice
        options: [both, ghcr, quay]
        default: both
      release_tag:
        description: Published signed foundation release to recover in mirror mode
        type: string
        default: ''
      revision:
        description: Revision for the pinned AL2023 snapshot
        type: string
        default: '1'
        required: true
      expected_commit:
        description: Protected main commit selected by update automation
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-stable-release
  cancel-in-progress: false
jobs:
  plan:
    name: Verify signed stable language releases and public mirrors
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Require protected main and bind the stable release evidence
        env:
          REVISION: ${{ inputs.revision }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-stable-evidence
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = rambow-cloud/amazon-linux-distroless
          test -z "$EXPECTED_COMMIT" || test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.match(process.env.REVISION, /^[1-9][0-9]{0,5}$/);'
          node scripts/release/project-stable-evidence.mjs stable-language-evidence.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: stable-language-evidence
          path: stable-language-evidence.json
          if-no-files-found: error
          overwrite: true
  qualify:
    name: Qualify native static and base images
    needs: plan
    uses: ./.github/workflows/foundation-build.yml
    with:
      force: true
  foundation-security:
    name: Fresh foundation scans
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: foundation-oci-indexes
          path: out/foundation-evidence
      - run: node scripts/release/foundation-scan.mjs out/foundation-evidence out/foundation-scans
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: fresh-foundation-scans
          path: out/foundation-scans/*.json
          if-no-files-found: ignore
  publish:
    name: Sign and publish verified foundation images
    needs: [qualify, foundation-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '{foundation-candidate-*,foundation-oci-indexes,fresh-foundation-scans,stable-language-evidence}'
          path: out/release-inputs
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install regctl for registry copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/install-regctl.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/foundation-auth
          REVISION: ${{ inputs.revision }}
        run: node scripts/release/foundation-publish.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: published-foundation-release
          path: out/foundation-release/foundation-release.json
          if-no-files-found: error
  mirror:
    name: Mirror the signed foundation indexes and attestations
    needs: publish
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      github.repository == 'rambow-cloud/amazon-linux-distroless' &&
      (inputs.mode == 'mirror' || needs.publish.result == 'success')
    environment: quay-runtime-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Install regctl for registry copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/install-regctl.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/foundation-mirror-auth
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FOUNDATION_RELEASE_TAG: ${{ inputs.mode == 'mirror' && inputs.release_tag || '' }}
          FOUNDATION_MIRROR_REGISTRY: ${{ inputs.mode == 'mirror' && inputs.registry || vars.QUAY_RUNTIME_MIRROR_ENABLED == 'true' && 'both' || 'ghcr' }}
        run: node scripts/release/foundation-mirror.mjs
