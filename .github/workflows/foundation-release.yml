name: Publish stable foundation images
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Revision for the pinned AL2023 snapshot
        type: string
        default: '1'
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-stable-release
  cancel-in-progress: false
jobs:
  plan:
    name: Require protected main and select stable language lines
    runs-on: ubuntu-24.04
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = rambow-cloud/amazon-linux-distroless
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.match(process.env.REVISION, /^[1-9][0-9]{0,5}$/);
          const plan = JSON.parse(fs.readFileSync('releases/stable-candidates.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'languages=' + JSON.stringify(Object.keys(plan)) + '\n');
          NODE
  qualify:
    name: Require full project qualification
    needs: plan
    uses: ./.github/workflows/project-qualification.yml
  language-security:
    name: Fresh stable language scan (${{ matrix.runtime }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.plan.outputs.languages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUNTIME: ${{ matrix.runtime }}
          STABLE_MODE: check
          DOCKER_CONFIG: ${{ runner.temp }}/stable-read-only
        run: node scripts/release/runtime-stable.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fresh-language-scan-${{ matrix.runtime }}
          path: out/stable-evidence/*.json
          if-no-files-found: ignore
  foundation-security:
    name: Fresh foundation scans
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: foundation-oci-indexes
          path: out/foundation-evidence
      - run: node scripts/release/foundation-scan.mjs out/foundation-evidence out/foundation-scans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fresh-foundation-scans
          path: out/foundation-scans/*.json
          if-no-files-found: ignore
  publish:
    name: Sign and publish verified foundation images
    needs: [qualify, foundation-security, language-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{foundation-candidate-*,foundation-oci-indexes,project-qualification-report,fresh-foundation-scans,fresh-language-scan-*}'
          path: out/release-inputs
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/foundation-auth
          REVISION: ${{ inputs.revision }}
        run: node scripts/release/foundation-publish.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: published-foundation-release
          path: out/foundation-release/foundation-release.json
          if-no-files-found: error
