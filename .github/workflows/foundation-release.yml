name: Publish stable foundation images
run-name: ${{ inputs.mode == 'mirror' && format('Mirror foundation ({0})', inputs.registry) || format('Foundation revision {0}', inputs.revision) }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish a qualified snapshot or mirror the current signed release
        type: choice
        options: [publish, mirror]
        default: publish
      registry:
        description: Destination in mirror mode
        type: choice
        options: [both, ghcr, quay]
        default: both
      revision:
        description: Revision for the pinned AL2023 snapshot
        type: string
        default: '1'
        required: true
      expected_commit:
        description: Protected main commit selected by update automation
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: foundation-stable-release
  cancel-in-progress: false
jobs:
  plan:
    name: Require protected main and select stable language lines
    if: inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    outputs:
      languages: ${{ steps.plan.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          REVISION: ${{ inputs.revision }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = rambow-cloud/amazon-linux-distroless
          test -z "$EXPECTED_COMMIT" || test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.match(process.env.REVISION, /^[1-9][0-9]{0,5}$/);
          const plan = JSON.parse(fs.readFileSync('releases/stable-candidates.json'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'languages=' + JSON.stringify(Object.keys(plan)) + '\n');
          NODE
  qualify:
    name: Require full project qualification
    needs: plan
    uses: ./.github/workflows/project-qualification.yml
  language-security:
    name: Fresh stable language scan (${{ matrix.runtime }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.plan.outputs.languages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUNTIME: ${{ matrix.runtime }}
          STABLE_MODE: check
          DOCKER_CONFIG: ${{ runner.temp }}/stable-read-only
        run: node scripts/release/runtime-stable.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-language-scan-${{ matrix.runtime }}
          path: out/stable-evidence/*.json
          if-no-files-found: ignore
  foundation-security:
    name: Fresh foundation scans
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-oci-indexes
          path: out/foundation-evidence
      - run: node scripts/release/foundation-scan.mjs out/foundation-evidence out/foundation-scans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fresh-foundation-scans
          path: out/foundation-scans/*.json
          if-no-files-found: ignore
  publish:
    name: Sign and publish verified foundation images
    needs: [qualify, foundation-security, language-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{foundation-candidate-*,foundation-oci-indexes,project-qualification-report,fresh-foundation-scans,fresh-language-scan-*}'
          path: out/release-inputs
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/foundation-auth
          REVISION: ${{ inputs.revision }}
        run: node scripts/release/foundation-publish.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: published-foundation-release
          path: out/foundation-release/foundation-release.json
          if-no-files-found: error
  mirror:
    name: Mirror the signed foundation indexes and attestations
    needs: publish
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      github.repository == 'rambow-cloud/amazon-linux-distroless' &&
      (inputs.mode == 'mirror' || needs.publish.result == 'success')
    environment: quay-runtime-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6
      - env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/foundation-mirror-auth
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FOUNDATION_MIRROR_REGISTRY: ${{ inputs.mode == 'mirror' && inputs.registry || vars.QUAY_RUNTIME_MIRROR_ENABLED == 'true' && 'both' || 'ghcr' }}
        run: node scripts/release/foundation-mirror.mjs
