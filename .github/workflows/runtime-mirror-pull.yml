name: Verify public runtime mirrors
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Public registries to verify
        type: choice
        options: [both, ghcr, quay]
        default: both
        required: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify public runtime mirrors (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Pull, verify, and run the signed images without registry credentials
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-runtime-mirror-config
          MIRROR_REGISTRY: ${{ inputs.registry }}
          MIRROR_ARCH: ${{ matrix.arch }}
        run: node scripts/release/verify-runtime-mirrors.mjs
