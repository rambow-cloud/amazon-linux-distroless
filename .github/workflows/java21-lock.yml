name: Java runtime lock update
on:
  workflow_dispatch:
    inputs:
      major:
        description: Corretto major to resolve
        type: choice
        options: ['17', '21', '25']
        default: '21'
        required: true
env:
  JAVA_MAJOR: ${{ inputs.major || '21' }}
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve Java ${{ inputs.major }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve exact binary/source inputs on the native architecture
        run: node scripts/java21/lock.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java${{ inputs.major || '21' }}-lock-${{ matrix.arch }}
          path: out/java${{ inputs.major || '21' }}-lock/*${{ matrix.arch }}.*
          retention-days: 14
