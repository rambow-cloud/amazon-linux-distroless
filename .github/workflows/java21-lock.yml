name: Java 21 lock update
on:
  workflow_dispatch:
  push:
    branches: [java21/complete]
    paths:
      - images/java21/packages.json
      - images/java21/Dockerfile
      - scripts/java21/lock.mjs
      - .github/workflows/java21-lock.yml
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve Java 21 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve exact binary/source inputs on the native architecture
        run: node scripts/java21/lock.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java21-lock-${{ matrix.arch }}
          path: out/java21-lock/linux-${{ matrix.arch }}.json
          retention-days: 14
