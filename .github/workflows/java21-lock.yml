name: Java runtime lock update
on:
  workflow_dispatch:
    inputs:
      major:
        description: Corretto major to resolve
        type: choice
        options: ['17', '21', '25']
        default: '21'
        required: true
env:
  JAVA_MAJOR: ${{ inputs.major || '21' }}
permissions:
  contents: read
jobs:
  resolve:
    name: Resolve Java ${{ inputs.major }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact binary/source inputs on the native architecture
        run: node scripts/java21/lock.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java${{ inputs.major || '21' }}-lock-${{ matrix.arch }}
          path: out/java${{ inputs.major || '21' }}-lock/*${{ matrix.arch }}.*
          retention-days: 14
