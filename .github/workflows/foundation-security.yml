name: Foundation vulnerability gate
on:
  pull_request:
    paths:
      - .github/workflows/foundation-security.yml
      - scripts/release/foundation-scan.mjs
      - releases/vulnerability-exceptions.json
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  qualify:
    name: Qualify native foundations
    uses: ./.github/workflows/foundation-build.yml
    with:
      force: true
  scan:
    name: Scan exact native static and base payloads
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-oci-indexes
          path: out/foundation-evidence
      - run: node scripts/release/foundation-scan.mjs out/foundation-evidence out/foundation-scans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foundation-scan-evidence
          path: out/foundation-scans/*.json
          if-no-files-found: ignore
          retention-days: 30
