name: ALAS backport regression
on:
  pull_request:
    paths:
      - .github/workflows/alas-backport.yml
      - scripts/release/alas-scan.mjs
      - scripts/release/check-alas-backport.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory:
    name: Verify the AL2023 RPM backport matcher
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/release/check-alas-backport.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: alas-backport-comparison
          path: out/alas-backport/
          if-no-files-found: ignore
