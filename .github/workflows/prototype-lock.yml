name: Prototype lock update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    name: Resolve AL2023 RPM lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve and verify official inputs
        run: node scripts/prototype.mjs lock
      - name: Upload candidate for human review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prototype-lock-linux-amd64
          path: out/linux-amd64.json
          if-no-files-found: error
          retention-days: 14
