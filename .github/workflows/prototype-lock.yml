name: Prototype lock update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock:
    name: Resolve AL2023 RPM lock
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve and verify official inputs
        run: node scripts/prototype.mjs lock
      - name: Upload candidate for human review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototype-lock-linux-amd64
          path: out/linux-amd64.json
          if-no-files-found: error
          retention-days: 14
