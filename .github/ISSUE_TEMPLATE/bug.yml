name: Bug report
description: Report a reproducible build, image, or workflow defect.
title: "[Bug] "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: Do not disclose sensitive vulnerabilities here. Use private vulnerability reporting instead.
  - type: input
    id: image
    attributes:
      label: Affected image or commit
      description: Include an immutable image digest or commit SHA. Use bootstrap if no image exists.
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [linux/amd64, linux/arm64, Both, Not architecture-specific]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, container engine, build tool versions, and runtime flags.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal commands or a small reproducer without secrets.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add observable completion criteria as Markdown checkboxes.
      placeholder: "- [ ] The reproducer passes on the affected architecture."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
